name: Build and Push Container Image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  # Weekly rebuild for base image and EPEL security updates. This relay
  # listens on :25 to the public internet, so it does not get to go stale
  # between commits.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
env:
  REGISTRY: quay.io
  IMAGE_NAME: crunchtools/postfix
  GHCR_IMAGE: ghcr.io/crunchtools/postfix

jobs:
  # The image runs two daemons (postfix and opendkim), which the container-image
  # profile requires a boot test for. It builds with podman rather than reusing
  # the buildx image below because the push jobs address the image by tag, and
  # a gate has to run before anything is pushed. The double build costs about a
  # minute; wiring the gate to the pushed digest instead is the promotion
  # rework tracked separately.
  boot-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image for testing
        run: podman build -f Containerfile -t localhost/postfix:boot-test .

      - name: Boot test — postfix answers, opendkim signs, forgery gate closed
        run: ./test/boot-test.sh localhost/postfix:boot-test

  build-and-push-quay:
    runs-on: ubuntu-latest
    needs: boot-test
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Push only on builds from the default branch / dispatch / cron.
      # PR builds verify the Containerfile without publishing.
      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            # `latest` is the newest STABLE RELEASE, not the newest build of the
            # branch, which has its own tag above (constitution 1.33.0, RT#1559).
            # A prerelease is not what `latest` means, so it is excluded by the
            # hyphen: SemVer puts every prerelease identifier after one.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  build-and-push-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            # `latest` is the newest STABLE RELEASE, not the newest build of the
            # branch, which has its own tag above (constitution 1.33.0, RT#1559).
            # A prerelease is not what `latest` means, so it is excluded by the
            # hyphen: SemVer puts every prerelease identifier after one.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
